<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Summa — You're Enrolled!</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #0f1923;
    color: #ffffff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
  }
  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 24px;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 48px;
  }
  .logo span { color: #c9a84c; }
  .icon { font-size: 64px; margin-bottom: 24px; }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(32px, 5vw, 52px);
    font-weight: 900;
    color: #c9a84c;
    margin-bottom: 16px;
    letter-spacing: -0.02em;
  }
  p {
    font-size: 17px;
    color: rgba(255,255,255,0.65);
    max-width: 480px;
    line-height: 1.7;
    font-weight: 300;
    margin-bottom: 12px;
  }
  .highlight {
    color: #ffffff;
    font-weight: 500;
  }
  .back {
    margin-top: 40px;
    color: rgba(255,255,255,0.4);
    font-size: 13px;
    text-decoration: none;
    transition: color 0.2s;
  }
  .back:hover { color: #c9a84c; }
</style>
</head>
<body>
  <div class="logo">Daily<span>Summa</span></div>
  <div class="icon">🎉</div>
  <h1>You're enrolled!</h1>
  <p>Welcome to Daily Summa. We received your enrollment and will have your family set up <span class="highlight">within 24 hours.</span></p>
  <p>Keep an eye on your inbox for your first Daily Summa update — delivered before breakfast.</p>
  <a href="/" class="back">← Back to dailysumma.com</a>
</body>
</html>
